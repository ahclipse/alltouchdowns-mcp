[project]
name = "alltouchdowns-mcp"
version = "0.1.0"
description = "Read-only MCP server for every NFL touchdown since 1999, from the AllTouchdowns dataset."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "mcp>=2.3,<3",
    "pyjwt[crypto]>=2.10",  # token verification in auth.py
    "uvicorn>=0.30",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
# Only the eval runner talks to a model. The server itself never does.
evals = ["anthropic>=2.8,<3"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alltouchdowns_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests", "evals"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
