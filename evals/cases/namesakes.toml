question = "Two players named Adrian Peterson scored touchdowns in the 2007 regular season. How many did the two of them score between them in that regular season?"
expect = "answer"
answer_kind = "number"
truth_sql = '''
SELECT COUNT(*) FROM touchdowns t JOIN players p ON p.slug = t.player_slug
WHERE p.display_name = 'Adrian Peterson' AND t.season = 2007 AND t.postseason = 0
'''
expected_tools = [["find_players"], ["search_touchdowns", "get_player"]]
max_calls = 5
reference_calls = [
  { tool = "find_players", args = { query = "Adrian Peterson" } },
  { tool = "search_touchdowns", args = { player = "adrian-peterson", season = 2007, season_type = "regular", limit = 1 } },
  { tool = "search_touchdowns", args = { player = "adrian-peterson-2", season = 2007, season_type = "regular", limit = 1 } },
]
notes = "Both namesakes are wanted, and the number on screen is wrong for one of them. The name search shows 3 and 18 regular-season touchdowns, but the 18 covers every loaded season: 13 for Minnesota in 2007 and 5 for Washington in 2019. Adding the two rows gives 21. Truth re-derived 2026-11-16: 16 (3 for Chicago's player, 13 for Minnesota's). The answer is the sum of two searches, worked out in evals/solutions.py."
