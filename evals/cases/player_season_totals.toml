  { tool = "search_touchdowns", args = { player = "anthony-firkser", season = 2019 } },
]
reference_path = "matched.postseason"
notes = "Playoffs only. The games were played in January 2020 but belong to the 2019 season. He scored more in the playoffs than in the regular season (1), so neither the regular-season count nor the total (3) is right. Truth re-derived 2026-11-16: 2 (weeks 18 and 20)."

