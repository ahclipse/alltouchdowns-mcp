# One player's touchdowns in one season. The name has to be turned into a slug first, and the
# answer then depends on reading the right part of the split: regular season, playoffs or both,
# one touchdown type, or one team. Five cases ask for a count. Cases 04 and 06 ask for the
# games instead, because a game id cannot be recalled the way a season total can. Every
# reference solution filters by season, so it holds against any database, not only the
# two-season fixture.

[[case]]
id = "player-season-totals-01"
category = "player_season_totals"
split = "dev"
question = "How many touchdowns did Najeh Davenport score in the 2007 regular season?"
expect = "answer"
answer_kind = "number"
truth_sql = '''
SELECT COUNT(*) FROM touchdowns
WHERE player_slug = 'najeh-davenport' AND season = 2007 AND postseason = 0
'''
expected_tools = [["find_players"]]
max_calls = 4
reference_calls = [
  { tool = "find_players", args = { query = "Najeh Davenport" } },
  { tool = "search_touchdowns", args = { player = "najeh-davenport", season = 2007 } },
]
reference_path = "matched.regular_season"
notes = "Regular season only, for a backup who also scored twice in the playoffs, so the season total (9) is the wrong answer. Truth re-derived 2026-11-16: 7 (5 rushing, 2 receiving, weeks 3 to 17)."

