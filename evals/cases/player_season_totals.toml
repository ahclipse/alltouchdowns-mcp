[[case]]
id = "player-season-totals-04"
category = "player_season_totals"
split = "heldout"
question = "In which game of the 2007 regular season did Baltimore's Yamon Figurs return a kickoff for a touchdown?"
expect = "answer"
answer_kind = "set"
item_type = "game_id"
truth_sql = '''
SELECT DISTINCT game_id FROM touchdowns
WHERE player_slug = 'yamon-figurs' AND season = 2007 AND postseason = 0
  AND td_type = 'kickoff_return'
'''
expected_tools = [["find_players"], ["search_touchdowns", "get_player"]]
max_calls = 4
reference_calls = [
  { tool = "find_players", args = { query = "Yamon Figurs" } },
  { tool = "search_touchdowns", args = { player = "yamon-figurs", season = 2007, td_type = "kickoff_return" } },
]
reference_path = "touchdowns[*].game_id"
notes = "One touchdown type for a little-known return specialist, asked as the game and not as a count, so nothing can be recalled. He scored twice that season, both times on a return: a punt in week 3 (2007-03-ARI-BAL) and this kickoff. The two return types must be kept apart, and his first touchdown is the wrong one. Truth re-derived 2026-11-16: 2007-14-IND-BAL (week 14, 94 yards, Baltimore's only kickoff-return touchdown of the season)."

