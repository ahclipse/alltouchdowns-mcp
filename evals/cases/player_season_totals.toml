[[case]]
id = "player-season-totals-06"
category = "player_season_totals"
split = "dev"
question = "Emmanuel Sanders changed teams during the 2019 season. In which games did he score a touchdown for San Francisco in that regular season?"
expect = "answer"
answer_kind = "set"
item_type = "game_id"
truth_sql = '''
SELECT DISTINCT game_id FROM touchdowns
WHERE player_slug = 'emmanuel-sanders' AND season = 2019 AND postseason = 0
  AND team_abbr = 'SF'
'''
expected_tools = [["find_players"], ["search_touchdowns"]]
max_calls = 4
reference_calls = [
  { tool = "find_players", args = { query = "Emmanuel Sanders" } },
  { tool = "search_touchdowns", args = { player = "emmanuel-sanders", team = "San Francisco", season = 2019, season_type = "regular" } },
]
reference_path = "touchdowns[*].game_id"
notes = "The games with one of the two teams a player scored for in the same season. His count could be recalled; the game ids cannot. His first two touchdowns of 2019 were for Denver (2019-01-DEN-OAK, 2019-02-CHI-DEN) and must be left out. San Francisco then played three playoff games, in which he did not score. Truth re-derived 2026-11-16: 2019-08-CAR-SF, 2019-09-SF-ARI, 2019-14-SF-NO (one reception in each; his season total is 5)."

