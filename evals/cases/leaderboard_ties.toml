# Leaderboards where players are tied at the cut-off. The tool keeps the whole tied group, so
# a correct answer has more rows than the "top N" asked for.

[[case]]
id = "leaderboard-ties-01"
category = "leaderboard_ties"
split = "dev"
question = "List the top 3 scorers of interception-return touchdowns in the 2007 regular season, best first. Include every player tied with third place."
expect = "answer"
answer_kind = "ordered_list"
item_type = "player_slug"
truth_sql = '''
WITH counts AS (
  SELECT player_slug, COUNT(*) AS n FROM touchdowns
  WHERE season = 2007 AND postseason = 0 AND td_type = 'int_return' AND player_slug IS NOT NULL
  GROUP BY player_slug
)
SELECT player_slug, n FROM counts
WHERE n >= (SELECT n FROM counts ORDER BY n DESC LIMIT 1 OFFSET 2)
ORDER BY n DESC, player_slug
'''
expected_tools = [["get_leaderboard"]]
max_calls = 3
reference_calls = [{ tool = "get_leaderboard", args = { season = 2007, td_type = "int_return", limit = 3 } }]
reference_path = "rows[*].player.slug"
notes = "One player has 3, then five are tied on 2, so six rows. Defensive scorers are not memorable, so this needs the tool."

