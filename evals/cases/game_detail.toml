# Questions about one game, described the way a fan would: season, week and cities, never a
# game id. The agent has to find the game and then read its touchdown rows correctly: their
# order, which team scored, the quarter, the type and who scored more than once.

[[case]]
id = "game-detail-01"
category = "game_detail"
split = "dev"
question = "List the players who scored touchdowns in the week 10 game between Los Angeles and Oakland in the 2019 regular season, in the order the touchdowns were scored."
expect = "answer"
answer_kind = "ordered_list"
item_type = "player_slug"
truth_sql = '''
SELECT player_slug, game_seq FROM touchdowns
WHERE season = 2019 AND week = 10 AND player_slug IS NOT NULL
  AND game_id IN (
    SELECT game_id FROM games
    WHERE 'LAC' IN (away_abbr, home_abbr) AND 'OAK' IN (away_abbr, home_abbr)
  )
ORDER BY game_seq
'''
expected_tools = [["get_game"]]
max_calls = 3
reference_calls = [{ tool = "get_game", args = { season = 2019, week = 10, team = "Oakland" } }]
reference_path = "touchdowns[*].scorer.slug"
notes = "Scorers in order, six touchdowns by six different players. 'Los Angeles' alone is refused as ambiguous, and the other Los Angeles team also played that week (at Pittsburgh), so the game has to be found through Oakland or the right abbreviation. Truth re-derived 2026-11-16 (ordering by running score and by quarter and time left agree with game_seq): erik-harris, hunter-henry, melvin-gordon, alec-ingold, austin-ekeler, josh-jacobs."

[[case]]
id = "game-detail-02"
category = "game_detail"
split = "dev"
question = "How many touchdowns did St. Louis score in its week 5 game of the 2007 regular season?"
expect = "answer"
answer_kind = "number"
truth_sql = "SELECT COUNT(*) FROM touchdowns WHERE season = 2007 AND week = 5 AND team_abbr = 'STL'"
expected_tools = [["get_game", "search_touchdowns"]]
max_calls = 3
reference_calls = [{ tool = "search_touchdowns", args = { team = "St. Louis", season = 2007, week = 5 } }]
reference_path = "matched.total"
notes = "One team's touchdowns in a game described by one city, for a team that has since moved (St. Louis in 2007, Los Angeles today). The game had 7 touchdowns, 4 of them Arizona's, so the game total and the opponent's count are both wrong answers. Truth re-derived 2026-11-16 by reading the rows of 2007-05-ARI-STL (drew-bennett, torry-holt, randy-mcmichael): 3."

[[case]]
id = "game-detail-03"
category = "game_detail"
split = "dev"
question = "Who scored the last touchdown of the week 7 game between Miami and Buffalo in the 2019 regular season?"
expect = "answer"
answer_kind = "set"
item_type = "player_slug"
truth_sql = '''
SELECT player_slug FROM touchdowns
WHERE season = 2019 AND week = 7
  AND game_id IN (
    SELECT game_id FROM games
    WHERE 'MIA' IN (away_abbr, home_abbr) AND 'BUF' IN (away_abbr, home_abbr)
  )
ORDER BY game_seq DESC LIMIT 1
'''
expected_tools = [["get_game", "search_touchdowns"]]
max_calls = 3
reference_calls = [{ tool = "search_touchdowns", args = { season = 2019, week = 7, team = "Buffalo", order = "newest", limit = 1 } }]
reference_path = "touchdowns[*].scorer.slug"
notes = "The last touchdown of a game: a defensive back's kickoff return, nine seconds of game time after the previous score. An agent would call get_game and read the last row; the reference instead asks for Buffalo's newest touchdown that week, because a reference_path cannot pick one row out of a game. Truth re-derived 2026-11-16 (latest by quarter and time left, 4th quarter 01:45): micah-hyde."

