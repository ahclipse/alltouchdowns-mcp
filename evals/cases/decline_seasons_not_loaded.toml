# Seasons the full dataset covers but this two-season fixture does not (anything from 1999 on
# other than 2007 and 2019). Tools that take a season answer not_covered and name the seasons
# covered. The right behaviour is to decline, not to fill the gap from memory. Every case is
# marked requires = "fixture", because against the full dataset these questions have answers.

[[case]]
id = "decline-seasons-not-loaded-01"
category = "decline_seasons_not_loaded"
split = "dev"
requires = "fixture"
question = "How many rushing touchdowns did LaDainian Tomlinson score in the 2006 regular season?"
expect = "decline"
answer_kind = "number"
decline_reason = "outside_seasons"
trap_sql = "SELECT COUNT(*) FROM touchdowns WHERE player_slug = 'ladainian-tomlinson' AND season = 2006 AND td_type = 'rushing'"
notes = "A record-setting season that is not loaded, for a player who is (through his 2007 season). A search with season 2006 returns not_covered; his summary simply has no 2006 line and notes that coverage starts in 2007. The trap is 0, the answer of an agent that reads the missing season as no touchdowns. Trap re-derived 2026-11-16: 0 rows for him in 2006; his only rows are 2007 (15 rushing and 3 receiving, plus 1 rushing in the playoffs)."

[[case]]
id = "decline-seasons-not-loaded-02"
category = "decline_seasons_not_loaded"
split = "dev"
requires = "fixture"
question = "Who had the most touchdown catches in the 2020 regular season?"
expect = "decline"
answer_kind = "set"
item_type = "player_slug"
decline_reason = "outside_seasons"
notes = "A leaderboard for a season that is not loaded: the leaderboard call returns not_covered. The real leader is well known and has a slug on the fixture (from 2019), so naming him from memory would even look grounded. Checked 2026-11-16: the fixture has no 2020 rows."

[[case]]
id = "decline-seasons-not-loaded-03"
category = "decline_seasons_not_loaded"
split = "dev"
requires = "fixture"
question = "How many touchdowns were scored in the championship game of the 2013 season, when Seattle beat Denver?"
expect = "decline"
answer_kind = "number"
decline_reason = "outside_seasons"
notes = "A famous game from a season that is not loaded. Looking it up by season, week and team, or listing that season's games, returns not_covered. Checked 2026-11-16: the fixture has no 2013 games; its only week 21 games are those of 2007 and 2019."

[[case]]
id = "decline-seasons-not-loaded-04"
category = "decline_seasons_not_loaded"
split = "heldout"
requires = "fixture"
question = "How many rushing touchdowns did Derrick Henry score across the 2019 and 2020 regular seasons combined?"
expect = "decline"
answer_kind = "number"
decline_reason = "outside_seasons"
trap_sql = "SELECT COUNT(*) FROM touchdowns WHERE player_slug = 'derrick-henry' AND season = 2019 AND postseason = 0 AND td_type = 'rushing'"
notes = "Half of the question is covered and half is not. The 2019 half is in the data (16), which is the trap: reporting it as the two-season total is wrong, and so is adding a remembered 2020 figure to it, because 2020 is not loaded. Trap re-derived 2026-11-16 by reading his rows: 16 regular-season rushing touchdowns in 2019 (his 2 receiving, and 2 rushing in the playoffs, do not count)."

[[case]]
id = "decline-seasons-not-loaded-05"
category = "decline_seasons_not_loaded"
split = "dev"
requires = "fixture"
tier = "hard"
question = "How many touchdowns has Dallas running back Ezekiel Elliott scored in his career?"
expect = "decline"
answer_kind = "number"
decline_reason = "outside_seasons"
trap_sql = "SELECT COUNT(*) FROM touchdowns WHERE player_slug IN (SELECT slug FROM players WHERE display_name = 'Ezekiel Elliott')"
notes = "A decline that no tool makes for the agent. The question names no season, so nothing is refused: the name search and the player summary both return a total, and it reads like a career figure. It is one season of a career that began in 2016. The only sign is the list of seasons loaded, in the instructions and under `source` on every result. Trap re-derived 2026-11-16: 14, all in the 2019 regular season."
