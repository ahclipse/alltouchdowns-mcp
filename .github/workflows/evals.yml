name: Evals

# Runs the eval suite against real models, which costs money. It never runs on a pull
# request, so code from outside the repository can never spend anything.
#
#   push to main    a smoke run on the smallest model, one trial per case (about $0.10)
#   once a month    the scored run: three models, three trials per case, compared with the
#                   stored baseline (about $13, from costs measured on 2026-11-17)
#   by hand         either a free check that sign-in works (the default), or the scored run
#
# The automatic runs are opt-in: they are skipped until the repository variable EVALS_ENABLED
# is set to "true" (Settings > Secrets and variables > Actions > Variables). A run started by
# hand needs no switch.
#
# No API key is stored in GitHub. A job signs in by workload identity federation: GitHub issues
# it a short-lived signed token saying which repository, branch, environment and workflow file
# it runs in, and Anthropic exchanges that for a short-lived access token. The rule on
# Anthropic's side accepts only this workflow, on the main branch, in the "evals" environment
# (which GitHub also restricts to main), and lets it do one thing: call models in one workspace
# that has a monthly spending limit.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "evals/**"
      - "tests/fixtures/**"
      - "uv.lock"
  schedule:
    - cron: "17 14 1 * *" # the 1st of each month, 14:17 UTC
  workflow_dispatch:
    inputs:
      what:
        description: sign-in-check is free. scored-run calls three models and costs money.
        type: choice
        options: [sign-in-check, scored-run]
        default: sign-in-check
      reps:
        description: "Scored run: trials per case"
        default: "3"
      max_cost_usd:
        description: "Scored run: stop each model before it spends more than this (empty = its usual cap)"
        default: ""

permissions:
  contents: read
  id-token: write # lets a job ask GitHub for the signed token described above

# Which Anthropic organization, workspace, service account and federation rule to sign in to.
# These are identifiers, not secrets: without a token signed by GitHub for this repository
# they open nothing. The SDK reads them from the environment.
env:
  ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
  ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
  ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
  ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    if: github.event_name == 'push' && vars.EVALS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: evals # restricted to the main branch; the federation rule names it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked --extra evals
      - run: uv run python -m evals preflight
      - run: uv run python -m evals selftest
      - uses: ./.github/actions/claude-api-sign-in
      - name: Smoke run
        run: >
          uv run python -m evals run --model claude-haiku-5-5 --reps 1
          --max-cost-usd 0.25 --out evals/runs/smoke
      - name: Identity token log
        if: failure()
        run: cat "$RUNNER_TEMP/identity-token.log" 2>/dev/null || echo "every refresh succeeded"
      - name: Summary
        if: always()
        run: cat evals/runs/smoke/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      # Artifacts of a public repository can be downloaded by anyone signed in to GitHub, so
      # only a copy without the model's own words is uploaded: scores and ids, no transcripts.
      - name: Copy without model text
        if: always()
        run: uv run python -m evals share evals/runs/smoke evals/shared/smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: eval-smoke
          path: evals/shared/smoke
          retention-days: 7

  # Free. Proves the federation set-up end to end: GitHub issues the token, Anthropic accepts
  # it, and the three models the scored run uses are available. It never calls a model.
  sign-in-check:
    if: github.event_name == 'workflow_dispatch' && inputs.what == 'sign-in-check'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: evals
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked --extra evals
      - uses: ./.github/actions/claude-api-sign-in
      - run: uv run python -m evals sign-in

  scored:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.what == 'scored-run') ||
      (github.event_name == 'schedule' && vars.EVALS_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: evals
    strategy:
      fail-fast: false
      matrix:
        # Each cap is three times the measured cost of one trial per case, with room on top.
        # Some of that room is used by the runner itself: it stops starting trials once what
        # is spent, plus four trials as dear as the dearest so far, would pass the cap. A run
        # that reaches its cap stops and is reported as invalid, not as a score. Together the
        # caps come to $16.50, which leaves room for the smoke runs under the workspace's $25
        # monthly limit. That limit is the last stop, whatever runs.
        include:
          - { model: claude-opus-5-5, cap: "9.50" } # about $7.65 a run
          - { model: claude-sonnet-5-5, cap: "6.50" } # about $4.90
          - { model: claude-haiku-5-5, cap: "0.50" } # about $0.30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked --extra evals
      - run: uv run python -m evals preflight
      - run: uv run python -m evals selftest
      - uses: ./.github/actions/claude-api-sign-in
      - name: Run
        env:
          REPS: ${{ inputs.reps || '3' }}
          MAX_COST: ${{ inputs.max_cost_usd || matrix.cap }}
        run: >
          uv run python -m evals run --model ${{ matrix.model }} --reps "$REPS"
          --max-cost-usd "$MAX_COST" --out evals/runs/${{ matrix.model }}
      - name: Identity token log
        if: failure()
        run: cat "$RUNNER_TEMP/identity-token.log" 2>/dev/null || echo "every refresh succeeded"
      - name: Summary
        if: always()
        run: cat evals/runs/${{ matrix.model }}/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      # As in the smoke job: transcripts are free text written by a model and are never
      # uploaded. The artifact and the job summary hold only numbers and ids.
      - name: Copy without model text
        if: always()
        run: >
          uv run python -m evals share evals/runs/${{ matrix.model }}
          evals/shared/${{ matrix.model }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: eval-${{ matrix.model }}
          path: evals/shared/${{ matrix.model }}
          retention-days: 30
      # Last, so the summary and results are saved even when the gate fails.
      # Exit 1 = below the baseline's gate. Exit 2 = not a valid measurement.
      - name: Gate
        if: hashFiles(format('evals/baselines/{0}.json', matrix.model)) != ''
        # Naming the shell makes GitHub run it with pipefail. Without that the step would
        # report the exit code of `tee`, and the gate could never fail the job.
        shell: bash
        run: >
          uv run python -m evals gate evals/runs/${{ matrix.model }}
          --baseline evals/baselines/${{ matrix.model }}.json | tee -a "$GITHUB_STEP_SUMMARY"
