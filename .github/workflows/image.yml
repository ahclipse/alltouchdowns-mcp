name: Image

# Builds the server image on GitHub's machines and pushes it to the GitHub Container Registry,
# tagged with the commit. The server that runs it only ever pulls a tag; it never builds.
on:
  push:
    branches: [main]
    paths: ["src/**", "uv.lock", "pyproject.toml", "Dockerfile", ".github/workflows/image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          platforms: linux/amd64

      # Run the image the way production does (read-only filesystem, no capabilities,
      # unprivileged user) and check it answers, before anything is pushed.
      - name: Smoke test with production hardening
        run: |
          docker run --detach --name smoke --publish 127.0.0.1:8000:8000 \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            --user 10001:10001 --tmpfs /tmp:size=16m --memory 256m --pids-limit 128 \
            --volume "$PWD/tests/fixtures/seasons-2007-2019.db:/data/mcp.db:ro" \
            --env ATD_ALLOWED_HOSTS='127.0.0.1:*' --env ATD_STALE_AFTER_HOURS=1000000 \
            "$IMAGE:sha-$GITHUB_SHA"
          for attempt in $(seq 1 20); do
            curl --silent --fail http://127.0.0.1:8000/healthz && break
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:8000/healthz
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header 'Host: evil.example' http://127.0.0.1:8000/healthz)" != "000"
          docker logs smoke
          docker rm --force smoke

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker push "$IMAGE:sha-$GITHUB_SHA"
